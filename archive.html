<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="点工Caoxu 归档页，集中查看已归档的博客文章与教程文章">
    <title>点工Caoxu - 归档</title>
    <link rel="stylesheet" href="css/style.css?v=20260816">
    <link rel="stylesheet" href="css/archive.css?v=20260816">
    <link rel="stylesheet" href="css/mouse-trail.css?v=20260816">
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-logo">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                </svg>
                <span class="logo-text">
                    <span class="logo-name">点工Caoxu</span>
                    <span class="logo-tagline">代码永远在等待一个它从未通过的测试</span>
                </span>
            </a>
            <ul class="nav-links">
                <li><a href="index.html">首页</a></li>
                <li><a href="blog.html">博客</a></li>
                <li><a href="tutorial.html">教程</a></li>
                <li><a href="about.html">关于我</a></li>
                <li>
                    <button class="theme-toggle" type="button" aria-label="切换主题">
                        <svg class="icon icon-sun" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
                            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
                            <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
                            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
                        </svg>
                        <svg class="icon icon-moon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                        </svg>
                    </button>
                </li>
            </ul>
        </div>
    </nav>

    <!-- 主体内容 -->
    <main class="archive-container">
        <h2 class="section-title">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
            </svg>
            归档
        </h2>
        <p class="archive-desc">这里集中展示已归档的内容，归档文章不再出现在首页、博客列表与教程目录中。</p>

        <!-- Tab 切换 -->
        <div class="archive-tabs" role="tablist">
            <button class="archive-tab" id="tabBlog" type="button" role="tab" aria-selected="false" data-type="blog">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                    <polyline points="14 2 14 8 20 8"/>
                    <line x1="16" y1="13" x2="8" y2="13"/>
                    <line x1="16" y1="17" x2="8" y2="17"/>
                </svg>
                博客归档 <span class="tab-count" id="blogCount">0</span>
            </button>
            <button class="archive-tab" id="tabTutorial" type="button" role="tab" aria-selected="false" data-type="tutorial">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                    <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
                </svg>
                教程归档 <span class="tab-count" id="tutorialCount">0</span>
            </button>
        </div>

        <!-- 博客归档列表 -->
        <section class="archive-panel" id="panelBlog" role="tabpanel">
            <div class="blog-list" id="archiveBlogList"></div>
            <p class="empty-hint" id="archiveBlogEmpty">暂无归档博客</p>
        </section>

        <!-- 教程归档列表 -->
        <section class="archive-panel" id="panelTutorial" role="tabpanel" hidden>
            <div class="tutorial-archive-list" id="archiveTutorialList"></div>
            <p class="empty-hint" id="archiveTutorialEmpty">暂无归档教程</p>
        </section>
    </main>

    <!-- 鼠标移动特效 -->
    <div class="mouse-trail-container" id="mouseTrail"></div>

    <script src="js/data.js?v=20260816"></script>
    <script src="js/utils.js?v=20260816"></script>
    <script src="js/theme.js?v=20260816"></script>
    <script src="js/mouse-trail.js?v=20260816"></script>
    <script src="js/archive.js?v=20260816"></script>
</body>
</html>
