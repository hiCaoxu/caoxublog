<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="CaoxuBlog 教程目录，包含前端基础和 JavaScript 系列教程">
    <title>CaoxuBlog - 教程</title>
    <link rel="stylesheet" href="css/style.css?v=20260807">
    <link rel="stylesheet" href="css/tutorial.css?v=20260807">
    <link rel="stylesheet" href="css/mouse-trail.css?v=20260807">
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-logo">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                </svg>
                <span class="logo-text">
                    <span class="logo-name">CaoxuBlog</span>
                    <span class="logo-tagline">代码永远在等待一个它从未通过的测试</span>
                </span>
            </a>
            <ul class="nav-links">
                <li><a href="index.html">首页</a></li>
                <li><a href="blog.html">博客</a></li>
                <li><a href="tutorial.html" class="active">教程</a></li>
                <li><a href="about.html">关于我</a></li>
                <li>
                    <button class="theme-toggle" type="button" aria-label="切换主题">
                        <svg class="icon icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
                            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
                            <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
                            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
                        </svg>
                        <svg class="icon icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                        </svg>
                    </button>
                </li>
            </ul>
        </div>
    </nav>

    <!-- 主体内容 -->
    <main class="tutorial-page-container" id="tutorialPageContainer">
        <!-- 左侧目录树 -->
        <aside class="tutorial-sidebar">
            <h3 class="sidebar-title">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
                </svg>
                教程目录
                <a class="archive-btn sidebar-archive" href="archive.html?type=tutorial" title="查看已归档的教程文章">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                        <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
                    </svg>
                    归档
                </a>
            </h3>
            <div class="folder-tree" id="folderTree"></div>
        </aside>

        <!-- 正文区域 -->
        <section class="tutorial-content" id="tutorialContent">
            <div class="tutorial-placeholder">
                <svg class="icon-lg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
                </svg>
                <p>请从左侧目录选择一篇文章</p>
            </div>
        </section>

        <!-- 评论区 -->
        <aside class="comment-sidebar" id="tutorialCommentSidebar" style="display:none;">
            <h3 class="comment-title">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                </svg>
                访客评论
            </h3>
            <div class="comment-list" id="tutorialCommentList"></div>
            <div class="comment-form">
                <input type="text" id="tutorialCommentNickname" placeholder="昵称（选填）" maxlength="20" aria-label="昵称">
                <textarea id="tutorialCommentContent" placeholder="写下你的评论..." rows="3" aria-label="评论内容"></textarea>
                <button class="btn-primary" onclick="submitTutorialComment()">发表评论</button>
            </div>
        </aside>
    </main>

    <!-- 鼠标移动特效 -->
    <div class="mouse-trail-container" id="mouseTrail"></div>

    <!-- 语法高亮 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github.min.css" id="hljs-light">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github-dark.min.css" id="hljs-dark" disabled>
    <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>

    <script src="js/data.js?v=20260807"></script>
    <script src="js/utils.js?v=20260807"></script>
    <script src="js/theme.js?v=20260807"></script>
    <script src="js/mouse-trail.js?v=20260807"></script>
    <script src="js/waline.js?v=20260807"></script>
    <script src="js/tutorial.js?v=20260807"></script>
</body>
</html>
