<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="CaoxuBlog 博客文章列表，包含前端技术分享和开发经验总结">
    <title>CaoxuBlog - 博客</title>
    <link rel="stylesheet" href="css/style.css?v=20260816">
    <link rel="stylesheet" href="css/blog.css?v=20260816">
    <link rel="stylesheet" href="css/mouse-trail.css?v=20260816">
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-logo">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                </svg>
                <span class="logo-text">
                    <span class="logo-name">CaoxuBlog</span>
                    <span class="logo-tagline">代码永远在等待一个它从未通过的测试</span>
                </span>
            </a>
            <ul class="nav-links">
                <li><a href="index.html">首页</a></li>
                <li><a href="blog.html" class="active">博客</a></li>
                <li><a href="tutorial.html">教程</a></li>
                <li><a href="about.html">关于我</a></li>
                <li>
                    <button class="theme-toggle" type="button" aria-label="切换主题">
                        <svg class="icon icon-sun" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
                            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
                            <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
                            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
                        </svg>
                        <svg class="icon icon-moon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                        </svg>
                    </button>
                </li>
            </ul>
        </div>
    </nav>

    <!-- 主体内容 -->
    <main class="blog-page-container" id="blogPageContainer">
        <!-- 博客列表 -->
        <section class="blog-list-section" id="blogListSection">
            <h2 class="section-title">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                    <polyline points="14 2 14 8 20 8"/>
                    <line x1="16" y1="13" x2="8" y2="13"/>
                    <line x1="16" y1="17" x2="8" y2="17"/>
                </svg>
                全部博客
            </h2>

            <!-- 搜索 + 标签筛选 -->
            <div class="blog-toolbar">
                <div class="toolbar-top">
                    <div class="search-box">
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
                        </svg>
                        <input type="text" id="blogSearch" placeholder="搜索标题、摘要或标签..." aria-label="搜索博客">
                    </div>
                    <a class="archive-btn" href="archive.html?type=blog" title="查看已归档的博客文章">
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
                        </svg>
                        归档
                    </a>
                </div>
                <div class="tag-filter" id="tagFilter"></div>
            </div>

            <div class="blog-list" id="blogList"></div>
            <p class="empty-hint" id="blogEmpty">暂无博客</p>
            <div class="pagination" id="blogPagination"></div>
        </section>

        <!-- 博客详情区域 -->
        <section class="blog-detail-section" id="blogDetail" style="display:none;">
            <article class="blog-article" id="blogArticleContent"></article>
        </section>

        <!-- 评论区 -->
        <aside class="comment-sidebar" id="commentSidebar" style="display:none;">
            <h3 class="comment-title">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                </svg>
                访客评论
            </h3>
            <div class="comment-list" id="commentList"></div>
            <div class="comment-form">
                <input type="text" id="commentNickname" placeholder="昵称（选填）" maxlength="20" aria-label="昵称">
                <textarea id="commentContent" placeholder="写下你的评论..." rows="3" aria-label="评论内容"></textarea>
                <button class="btn-primary" id="blogCommentSubmit">发表评论</button>
            </div>
        </aside>
    </main>

    <!-- 鼠标移动特效 -->
    <div class="mouse-trail-container" id="mouseTrail"></div>

    <!-- 语法高亮样式（自托管 vendor/，脚本由 utils.js 按需懒加载） -->
    <link rel="stylesheet" href="vendor/highlightjs/github.min.css" id="hljs-light">
    <link rel="stylesheet" href="vendor/highlightjs/github-dark.min.css" id="hljs-dark" disabled>

    <script src="js/data.js?v=20260816"></script>
    <script src="js/utils.js?v=20260816"></script>
    <script src="js/theme.js?v=20260816"></script>
    <script src="js/mouse-trail.js?v=20260816"></script>
    <script src="js/waline.js?v=20260816"></script>
    <script src="js/blog.js?v=20260816"></script>
</body>
</html>
