<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="CaoxuBlog - 简约清新的个人静态博客，分享前端技术、CSS技巧、JavaScript实践等内容">
    <title>CaoxuBlog - 首页</title>
    <link rel="stylesheet" href="css/style.css?v=20260816">
    <link rel="stylesheet" href="css/mouse-trail.css?v=20260816">
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-logo">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                </svg>
                <span class="logo-text">
                    <span class="logo-name">CaoxuBlog</span>
                    <span class="logo-tagline">代码永远在等待一个它从未通过的测试</span>
                </span>
            </a>
            <ul class="nav-links">
                <li><a href="index.html" class="active">首页</a></li>
                <li><a href="blog.html">博客</a></li>
                <li><a href="tutorial.html">教程</a></li>
                <li><a href="about.html">关于我</a></li>
                <li>
                    <button class="theme-toggle" type="button" aria-label="切换主题">
                        <svg class="icon icon-sun" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
                            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
                            <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
                            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
                        </svg>
                        <svg class="icon icon-moon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                        </svg>
                    </button>
                </li>
            </ul>
        </div>
    </nav>

    <!-- 主体内容 -->
    <main class="container">
        <!-- 置顶博客区域 -->
        <section class="pinned-section" id="pinnedSection">
            <h2 class="section-title">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z"/>
                </svg>
                置顶博客
            </h2>
            <div class="blog-grid" id="pinnedBlogs"></div>
            <p class="empty-hint" id="pinnedEmpty">暂无置顶博客</p>
        </section>

        <!-- 最新博客区域 -->
        <section class="latest-section">
            <h2 class="section-title">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
                </svg>
                最新博客
            </h2>
            <div class="blog-grid" id="latestBlogs"></div>
            <p class="empty-hint" id="latestEmpty">暂无博客</p>
        </section>
    </main>

    <!-- 鼠标移动特效 -->
    <div class="mouse-trail-container" id="mouseTrail"></div>

    <script src="js/data.js?v=20260816"></script>
    <script src="js/utils.js?v=20260816"></script>
    <script src="js/theme.js?v=20260816"></script>
    <script src="js/mouse-trail.js?v=20260816"></script>
    <script src="js/home.js?v=20260816"></script>
</body>
</html>
